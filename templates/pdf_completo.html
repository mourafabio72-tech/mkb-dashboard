<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório Completo — MKB Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('mkb-theme') || 'light');</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=20260805">
  <style>
    /* Barra de progresso (tela) */
    .pdf-loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--bg); gap: 16px;
    }
    .pdf-loading h2 { font-size: 18px; color: var(--text); margin: 0; }
    .pdf-loading .progress-bar {
      width: 320px; height: 6px; border-radius: 4px;
      background: var(--border); overflow: hidden;
    }
    .pdf-loading .progress-fill {
      height: 100%; width: 0%; background: var(--accent);
      transition: width .3s;
    }
    .pdf-loading .status { font-size: 13px; color: var(--muted); }

    /* Container do relatório */
    .pdf-container {
      display: none;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }

    /* Cada seção */
    .pdf-section {
      page-break-before: always;
      margin-bottom: 32px;
    }
    .pdf-section:first-child { page-break-before: auto; }
    .pdf-section-title {
      font-size: 16px; font-weight: 800; color: var(--text);
      border-bottom: 2px solid var(--accent); padding-bottom: 6px;
      margin-bottom: 16px;
    }

    /* Forçar conteúdo a caber na largura */
    .pdf-section .table-scroll,
    .pdf-section .table-responsive { overflow-x: auto; }
    .pdf-section .container { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
    .pdf-section .min-kpi-row { flex-wrap: wrap; }
    .pdf-section .min-grid-2 { grid-template-columns: 1fr; }
    .pdf-section .min-chart-card canvas { display: none; }
    .pdf-section .kpi-grid { flex-wrap: wrap; }

    /* Cabeçalho de impressão */
    .pdf-page-header {
      display: none; align-items: center; gap: 12px;
      margin-bottom: 12px; padding-bottom: 8px;
      border-bottom: 2px solid var(--text);
    }
    .pdf-page-header img { height: 28px; }
    .pdf-page-header span { font-size: 10px; color: var(--muted); }

    /* Botões fixos */
    .pdf-actions {
      position: fixed; bottom: 24px; right: 24px; z-index: 10000;
      display: flex; gap: 8px;
    }
    .pdf-actions button, .pdf-actions a {
      padding: 10px 20px; border-radius: 8px; border: none;
      font-size: 14px; font-weight: 700; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-imprimir { background: var(--accent); color: #fff; }
    .btn-imprimir:hover { filter: brightness(1.1); }
    .btn-voltar { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-voltar:hover { background: var(--card2); }

    @media print {
      @page { size: A4 landscape; margin: 12mm 10mm; }
      body { background: #fff !important; color: #222 !important; font-size: 11px; }
      .pdf-loading, .pdf-actions { display: none !important; }
      .pdf-container { display: block !important; max-width: 100% !important; padding: 0 !important; }
      .pdf-page-header { display: flex !important; }
      .pdf-section-title { color: #2f3b2f; border-color: #6e7f63; }
      .navbar, .footer { display: none !important; }
      .min-kpi, .min-kpi-hl, .kpi-card { background: #f5f5f5 !important; color: #222 !important; border: 1px solid #ccc !important; }
      .min-kpi-label, .kpi-label { color: #666 !important; }
      .min-kpi-value, .kpi-value { color: #222 !important; }
      .min-kpi-sub, .kpi-sub { color: #888 !important; }
      .section-card, .card-full, .min-chart-card { box-shadow: none !important; border: 1px solid #ccc !important; background: #fff !important; }
      .table-dre, .table-simple { font-size: 10px; }
      .table-scroll { overflow: visible !important; }
      * { color-adjust: exact; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

<div class="pdf-loading" id="loading">
  <h2>Montando relatório completo...</h2>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="status" id="statusText">Carregando seções...</div>
</div>

<div class="pdf-container" id="pdfContainer"></div>

<div class="pdf-actions" id="actions" style="display:none">
  <a class="btn-voltar" href="/">← Voltar</a>
  <button class="btn-imprimir" onclick="window.print()">
    <i class="ph-bold ph-printer"></i> Exportar PDF
  </button>
</div>

<script>
const URLS = {{ urls | tojson }};
const LOGO = "{{ url_for('static', filename='bps4-logo.png') }}";
const COMP = "{{ competencia or '' }}";

async function montarPDF() {
  const container = document.getElementById('pdfContainer');
  const fill = document.getElementById('progressFill');
  const status = document.getElementById('statusText');
  const total = URLS.length;

  for (let i = 0; i < total; i++) {
    const item = URLS[i];
    status.textContent = `Carregando: ${item.label} (${i + 1}/${total})`;
    fill.style.width = `${((i + 1) / total) * 100}%`;

    try {
      const resp = await fetch(item.url, {credentials: 'same-origin'});
      const html = await resp.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const main = doc.querySelector('main.container') || doc.querySelector('main') || doc.querySelector('.container');

      if (!main) continue;

      // Remove elementos interativos, gráficos e cards de gráfico vazios
      main.querySelectorAll(
        '.hub-list, .hub-grid, .mes-selector, .toggle-dre-tipo, .dre-actions, ' +
        '.notes-box, script, .flash-box, .info-box, ' +
        '.min-period-bar, .min-header-right, ' +
        '.navbar, .footer, .print-header'
      ).forEach(el => el.remove());

      // Remove cards que contêm gráficos (canvas) — ficam vazios sem o JS
      main.querySelectorAll('.min-chart-card, .grafico-wrap, .grafico-wrap-top10').forEach(el => el.remove());
      // Remove grids que ficaram vazios após remoção dos chart-cards
      main.querySelectorAll('.min-grid-2').forEach(el => {
        if (!el.children.length) el.remove();
      });

      // Remove botões soltos
      main.querySelectorAll('a.btn, button.btn, a.btn-sm, button.btn-sm, a.min-btn-ghost, a.min-btn-solid').forEach(el => el.remove());

      const section = document.createElement('div');
      section.className = 'pdf-section';

      // Cabeçalho por página (só aparece na impressão)
      const hdr = document.createElement('div');
      hdr.className = 'pdf-page-header';
      hdr.innerHTML = `<img src="${LOGO}" alt="BPS4"><span>MKB Dashboard · Grupo Markbuilding · ${item.label} · ${COMP}</span>`;
      section.appendChild(hdr);

      // Título da seção
      const title = document.createElement('div');
      title.className = 'pdf-section-title';
      title.textContent = item.label;
      section.appendChild(title);

      // Conteúdo
      const content = document.createElement('div');
      content.innerHTML = main.innerHTML;
      section.appendChild(content);

      container.appendChild(section);
    } catch (e) {
      console.warn(`Erro ao carregar ${item.label}:`, e);
    }
  }

  // Pronto
  document.getElementById('loading').style.display = 'none';
  container.style.display = 'block';
  document.getElementById('actions').style.display = 'flex';
}

montarPDF();
</script>
</body>
</html>
